<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PrepWeek</title>
    <meta name="description" content="PrepWeek puts everyone’s work on one timeline: drag a block onto someone, stretch it over the days it takes, and the whole team sees it live." />
    <meta property="og:title" content="PrepWeek: who’s doing what, week by week" />
    <meta property="og:description" content="The team planner you can read at a glance. Live, works offline, and brings your Teamweek history along." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#fbfafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#292c34" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PrepWeek" />
    <!-- Dark unless light was picked with the toggle, before anything paints. -->
    <script>
      var t = 'dark';
      try {
        if (localStorage.getItem('prepweek:theme') === 'light') t = 'light';
      } catch (e) {}
      document.documentElement.dataset.theme = t;
      document.querySelectorAll('meta[name=theme-color]').forEach(function (m) {
        m.content = t === 'dark' ? '#292c34' : '#fbfafc';
      });
      // The home page (see main.tsx) skips the "opening your sheet" screen.
      if (/^\/(welcome|appsumo|help|roadmap|privacy|terms)?\/?$/.test(location.pathname)) document.documentElement.dataset.landing = '';
    </script>
    <!-- Boot screen: inline so it paints before the bundle and data load. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fbfafc;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 500 13px/1.4 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #6a6573;
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .boot-mark {
        width: 70px;
        height: 40px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-stripes {
        fill: #a29daa;
      }
      .boot-bars {
        display: grid;
        gap: 7px;
        width: 180px;
      }
      .boot-bars i {
        display: block;
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, #efedf2 0%, #e2dfe8 50%, #efedf2 100%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.2s linear infinite;
      }
      .boot-bars i:nth-child(1) {
        width: 70%;
      }
      .boot-bars i:nth-child(2) {
        width: 82%;
        margin-left: 18%;
      }
      .boot-bars i:nth-child(3) {
        width: 46%;
      }
      @keyframes boot-shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.94);
          opacity: 0.85;
        }
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']),
        html:not([data-theme='light']) body {
          background: #292c34;
        }
        html:not([data-theme='light']) .boot {
          color: #9aa0ac;
        }
        html:not([data-theme='light']) .boot-bars i {
          background-image: linear-gradient(90deg, #30333c 0%, #3a3e48 50%, #30333c 100%);
        }
        html:not([data-theme='light']) .boot-stripes {
          fill: #74726a;
        }
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #292c34;
      }
      html[data-theme='dark'] .boot {
        color: #9aa0ac;
      }
      html[data-theme='dark'] .boot-bars i {
        background-image: linear-gradient(90deg, #30333c 0%, #3a3e48 50%, #30333c 100%);
      }
      html[data-theme='dark'] .boot-stripes {
        fill: #74726a;
      }
      html[data-landing] .boot {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-bars i {
          animation: none;
        }
      }
    </style>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-inner">

            <path d="M10.48 14H39.52C41.55 14 43.26 15.35 43.81 17.2Q41.19 17.67 39.65 19.86Q38.11 22.06 38.58 24.7L39.51 30H10.48C8.01 30 6 27.99 6 25.52V18.48C6 16.01 8.01 14 10.48 14Z" fill="#a5ceff" />

            <path class="boot-stripes" d="M39.47 49.53C39.04 49.31 38.65 49.03 38.31 48.69L50.71 36.29L53.13 35.87ZM41.48 50C41.45 50 41.43 50 41.4 50L53.87 37.53L54.32 39.08L43.4 50ZM37.35 47.25C37.13 46.74 37.01 46.18 37 45.6L45.62 36.98Q46.44 37.05 47.31 36.89L47.79 36.81ZM45.8 50 54.86 40.94 55.32 42.48 47.8 50ZM37 43.2V41.2L42.42 35.78Q42.44 35.8 42.47 35.82Q43.06 36.24 43.69 36.51ZM50.2 50 55.86 44.34 56.32 45.88 52.2 50ZM40.74 34.06Q40.93 34.36 41.16 34.64L37 38.8V38.48C37 37.62 37.24 36.82 37.66 36.14L39.14 34.66C39.62 34.36 40.16 34.16 40.74 34.06ZM56.88 47.72Q56.98 47.97 57.13 48.17C56.55 48.95 55.73 49.54 54.78 49.82L56.88 47.72Z" />
            <path d="M44.18 19.17 56.04 17.08C58.48 16.65 60.8 18.27 61.23 20.71L62.45 27.64C62.75 29.31 62.08 30.92 60.85 31.91L55.75 28.89Q54.83 28.35 53.81 28.65Q52.8 28.95 52.33 29.81Q51.85 30.68 52.15 31.69L52.8 33.89L46.96 34.92C44.52 35.35 42.2 33.73 41.77 31.29L40.55 24.36C40.12 21.92 41.75 19.6 44.18 19.17Z" fill="#ffb58f" />
            <path d="M54.73 30.61 68.48 38.75Q68.87 38.98 68.64 39.37Q68.54 39.53 68.35 39.58L62.4 40.96L59.53 46.93Q59.33 47.33 58.92 47.14Q58.74 47.05 58.69 46.86L54.07 31.13Q53.94 30.7 54.37 30.57Q54.56 30.51 54.73 30.61Z" fill="#d2448d" />
          </svg>
          <div class="boot-bars" aria-hidden="true"><i></i><i></i><i></i></div>
          <span>Opening your sheet…</span>
        </div>
      </div>
      <script>
        if (location.pathname === '/s/demo') document.querySelector('.boot span').textContent = 'Setting up the demo…';
      </script>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
