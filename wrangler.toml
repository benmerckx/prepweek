name = "prepweek"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# `wrangler deploy` / `wrangler dev` build the app first.
[build]
command = "bun run build"
watch_dir = "src"

# The Bun-built app. SPA fallback so /s/<sheet> works.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/sync/*", "/files/*", "/presence/*", "/share/*", "/archive/*", "/ical/*", "/auth/*", "/api/*"]

# One SQLite-backed Durable Object per sheet (storage + realtime room).
[[durable_objects.bindings]]
name = "SHEETS"
class_name = "SheetDurableObject"

# Live presence per sheet: a relay, stores nothing.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDurableObject"

# Accounts, workspaces and the sheet directory (one SQLite object).
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDurableObject"

# Each sheet's archive: tasks that finished a while ago, read by date range.
[[durable_objects.bindings]]
name = "ARCHIVES"
class_name = "ArchiveDurableObject"

# Public settings. The matching secrets (wrangler secret put …):
#   MANDRILL_API_KEY        magic-link and invite emails (Mandrill)
#   GOOGLE_CLIENT_SECRET    "Continue with Google"
#   APPSUMO_CLIENT_SECRET, APPSUMO_API_KEY   AppSumo licences (see worker/appsumo.ts)
#   CF_ACCOUNT_ID, CF_API_TOKEN   reading usage statistics back for /admin
#                           (an API token with "Account Analytics: Read")
[vars]
# Plans: "on" limits how many people a workspace plans for (Free 5, AppSumo
# tiers 15/40/100). Off, plans show but nothing is blocked. Turn on at launch.
PLAN_LIMITS = "on"
# AppSumo licensing (Partner Portal): the OAuth client id. Secrets:
#   wrangler secret put APPSUMO_CLIENT_SECRET
#   wrangler secret put APPSUMO_API_KEY
APPSUMO_CLIENT_ID = ""
# Links in the daily digest use the address people use the app at; set this
# to pin one, e.g. APP_URL = "https://plan.example.com".
EMAIL_FROM = "no-reply@prepweek.com"
GOOGLE_CLIENT_ID = "536583470323-hurodoi9k3c7voaik9i3fjbvjgk1amh3.apps.googleusercontent.com"
# Who may open /admin (comma separated).
ADMIN_EMAILS = "ben@codeurs.be"

# Hourly: sends the daily digest to everyone whose workday morning it is.
[triggers]
crons = ["0 * * * *"]

# Usage statistics for /admin (worker/stats.ts): cookieless counts of
# requests, errors, page views and a few product events. Kept 3 months.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "prepweek_events"

# Attachment storage (served by the worker at /files/<sheet>/<id>).
# Disabled until the bucket exists. To enable: run
# `wrangler r2 bucket create prepweek-files` and uncomment these lines.
# Without it, attachments stay in each browser (the worker answers 501).
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "prepweek-files"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SheetDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DirectoryDurableObject"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ArchiveDurableObject"]
