name = "prepweek"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# `wrangler deploy` / `wrangler dev` build the app first.
[build]
command = "bun run build"
watch_dir = "src"

# The Bun-built app. SPA fallback so /s/<sheet> works.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/sync/*", "/files/*", "/presence/*"]

# One SQLite-backed Durable Object per sheet (storage + realtime room).
[[durable_objects.bindings]]
name = "SHEETS"
class_name = "SheetDurableObject"

# Live presence per sheet: a relay, stores nothing.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDurableObject"

# Attachment storage (served by the worker at /files/<sheet>/<id>).
# Create the bucket once: `wrangler r2 bucket create prepweek-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "prepweek-files"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SheetDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PresenceDurableObject"]
