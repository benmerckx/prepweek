name = "prepweek"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# `wrangler deploy` / `wrangler dev` build the app first.
[build]
command = "bun run build"
watch_dir = "src"

# The Bun-built app. SPA fallback so /s/<sheet> works.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/sync/*"]

# One SQLite-backed Durable Object per sheet (storage + realtime room).
[[durable_objects.bindings]]
name = "SHEETS"
class_name = "SheetDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SheetDurableObject"]
