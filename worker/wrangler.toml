name = "prepweek"
main = "index.ts"
compatibility_date = "2026-09-01"

# The Bun-built app (bun run build). SPA fallback so /s/<sheet> works.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/sync/*"]

[[durable_objects.bindings]]
name = "SHEETS"
class_name = "SheetDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SheetDurableObject"]
